name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 4 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (java-kotlin)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: github/codeql-action/init@v4
        with:
          languages: java-kotlin
          build-mode: manual
      # google-services.json staat bewust niet in de repo; voor de analyse volstaat een dummy
      # met alleen de package-naam (geen echte project-id's of keys).
      - name: Dummy google-services.json
        run: |
          cat > app/google-services.json <<'JSON'
          {
            "project_info": { "project_number": "000000000000", "project_id": "codeql-dummy", "storage_bucket": "codeql-dummy.appspot.com" },
            "client": [{
              "client_info": { "mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": { "package_name": "info.cafferata.riskonacci" } },
              "oauth_client": [],
              "api_key": [{ "current_key": "codeql-dummy" }],
              "services": { "appinvite_service": { "other_platform_oauth_client": [] } }
            }],
            "configuration_version": "1"
          }
          JSON
      - name: Build
        run: ./gradlew --no-daemon assembleDebug
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:java-kotlin
